name: Publish Coach v0.2.0
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-coach-v0-2-0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'yiyi1108/ai-collaboration-coach' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - name: Verify prepared archive
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, shutil, zipfile
          archive = pathlib.Path('coach-source-import.zip')
          expected = 'c63d4812f911fafab1902c33d2473b625e6c050554600501e54aeeb0cab0754f'
          assert archive.is_file(), 'prepared archive missing'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'archive checksum mismatch'
          target = pathlib.Path('/tmp/coach-import')
          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True)
          allowed_files = {'.gitignore','README.md','LICENSE','THIRD_PARTY_NOTICES.md','CHANGELOG.md','使用说明_中文版.md'}
          allowed_dirs = {'ai-collaboration-coach','docs','licenses','tools'}
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts, item.filename
                  assert path.parts and (path.parts[0] in allowed_dirs or str(path) in allowed_files), item.filename
                  assert ((item.external_attr >> 16) & 0o170000) != 0o120000, item.filename
              assert z.testzip() is None
              z.extractall(target)
          skill = target / 'ai-collaboration-coach'
          required = [
              'SKILL.md','PORTABLE_PROMPT_ZH.md','agents/openai.yaml',
              'assets/collaboration-report-template.html','assets/resource-manifest.json',
              'references/domain-playbooks.md','references/reflection-report.md',
              'scripts/check_report.py','licenses/Apache-2.0.txt',
              'licenses/HarmonyOS-Sans-LICENSE.txt'
          ]
          for rel in required:
              assert (skill / rel).is_file(), rel
          text = (skill / 'SKILL.md').read_text(encoding='utf-8')
          assert text.startswith('---\nname: ai-collaboration-coach\n')
          assert 'description:' in text.split('---', 2)[1]
          PY

      - name: Promote Skill to repository root
        run: |
          git rm -r --ignore-unmatch .github ai-collaboration-coach .gitignore CHANGELOG.md coach-source-import.zip 使用说明_中文版.md
          cp -a /tmp/coach-import/ai-collaboration-coach/SKILL.md .
          cp -a /tmp/coach-import/ai-collaboration-coach/PORTABLE_PROMPT_ZH.md .
          cp -a /tmp/coach-import/ai-collaboration-coach/agents .
          cp -a /tmp/coach-import/ai-collaboration-coach/assets .
          cp -a /tmp/coach-import/ai-collaboration-coach/references .
          cp -a /tmp/coach-import/ai-collaboration-coach/scripts .
          cp -a /tmp/coach-import/ai-collaboration-coach/licenses .
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('.')
          skill = (root / 'SKILL.md').read_text(encoding='utf-8')
          for rel in re.findall(r'\((references|assets|scripts)/[^)]+\)', skill):
              pass
          links = re.findall(r'\(((?:references|assets|scripts)/[^)]+)\)', skill)
          missing = [rel for rel in links if not (root / rel).exists()]
          assert not missing, missing
          manifest = json.loads((root / 'assets/resource-manifest.json').read_text(encoding='utf-8'))
          for item in manifest:
              path = root / 'assets' / item['file']
              assert path.is_file() and path.stat().st_size == item['bytes'], item['file']
          PY

      - name: Build release package
        run: |
          mkdir -p /tmp/coach-release/ai-collaboration-coach
          cp -a SKILL.md PORTABLE_PROMPT_ZH.md LICENSE THIRD_PARTY_NOTICES.md /tmp/coach-release/ai-collaboration-coach/
          cp -a agents assets references scripts licenses /tmp/coach-release/ai-collaboration-coach/
          (cd /tmp/coach-release && zip -q -r ai-collaboration-coach.zip ai-collaboration-coach)
          (cd /tmp/coach-release && sha256sum ai-collaboration-coach.zip > SHA256SUMS.txt)
          unzip -t /tmp/coach-release/ai-collaboration-coach.zip

      - name: Commit clean installable repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "release: publish installable Coach v0.2.0"
          git push origin HEAD:main

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0             /tmp/coach-release/ai-collaboration-coach.zip             /tmp/coach-release/SHA256SUMS.txt             --target "$(git rev-parse HEAD)"             --title "Coach Skill v0.2.0 中文版"             --notes "面向 AI 素养实践课的中文 Coach Skill。支持从仓库链接安装；也可下载 ai-collaboration-coach.zip 并保留完整目录。包含主指令、领域方法、中文 MD 与固定模板 HTML 报告、字体资源及检查脚本。原创内容采用 MIT，第三方资源见许可说明。已完成设计者自测，尚未进行学生课堂公测。"             --latest
